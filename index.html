<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChristchurchNZ - Company Contacts</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        /* LOGIN */

        #loginScreen {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 15px;
        }

        .login-button {
            width: 100%;
            background: #1f6feb;
            color: white;
        }

        .login-button:hover {
            background: #1557b0;
        }

        .error {
            color: #d93025;
            margin-top: 10px;
            text-align: center;
        }

        /* APP */

        #app {
            display: none;
        }

        .header {
            background: white;
            padding: 18px 20px;
            border-bottom: 1px solid #ddd;
        }

        .header-content {
            max-width: 900px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        .change-password-button {
            background: #555;
            color: white;
        }

        .logout-button {
            background: #d93025;
            color: white;
        }

        .search {
            margin: 20px 0;
        }

        .contacts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .contact-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .contact-card h3 {
            margin-top: 0;
            margin-bottom: 12px;
        }

        .contact-card p {
            margin: 7px 0;
            word-break: break-word;
        }

        .contact-card a {
            color: #1f6feb;
            text-decoration: none;
        }

        .contact-buttons {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .call-button {
            background: #198754;
            color: white !important;
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: 7px;
        }

        .email-button {
            background: #1f6feb;
            color: white !important;
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: 7px;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        /* PASSWORD MODAL */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
        }

        .modal-content {
            background: white;
            max-width: 400px;
            margin: 100px auto;
            padding: 25px;
            border-radius: 10px;
        }

        .modal-content h2 {
            margin-top: 0;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .save-password {
            background: #198754;
            color: white;
            flex: 1;
        }

        .cancel-button {
            background: #777;
            color: white;
            flex: 1;
        }

        @media (max-width: 600px) {

            .header-content {
                flex-direction: column;
                align-items: stretch;
            }

            .header-buttons {
                width: 100%;
            }

            .header-buttons button {
                flex: 1;
            }

            .header h1 {
                text-align: center;
            }

            .contacts {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<!-- ============================= -->
<!-- LOGIN -->
<!-- ============================= -->

<div id="loginScreen">

    <div class="login-box">

        <h1>ChristchurchNZ</h1>

        <p>Company Contacts</p>

        <input
            type="email"
            id="email"
            placeholder="Company email"
            autocomplete="username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button
            class="login-button"
            onclick="login()"
        >
            Login
        </button>

        <div id="loginError" class="error"></div>

    </div>

</div>


<!-- ============================= -->
<!-- MAIN APP -->
<!-- ============================= -->

<div id="app">

    <div class="header">

        <div class="header-content">

            <h1>ChristchurchNZ - Company Contacts</h1>

            <div class="header-buttons">

                <button
                    class="change-password-button"
                    onclick="openPasswordModal()"
                >
                    Change Password
                </button>

                <button
                    class="logout-button"
                    onclick="logout()"
                >
                    Logout
                </button>

            </div>

        </div>

    </div>


    <div class="container">

        <div class="search">

            <input
                type="text"
                id="searchInput"
                placeholder="Search contacts..."
                oninput="searchContacts()"
            >

        </div>


        <div id="contactsList" class="contacts">

            <div class="loading">
                Loading contacts...
            </div>

        </div>

    </div>

</div>


<!-- ============================= -->
<!-- CHANGE PASSWORD -->
<!-- ============================= -->

<div id="passwordModal" class="modal">

    <div class="modal-content">

        <h2>Change Password</h2>

        <input
            type="password"
            id="newPassword"
            placeholder="New password"
            autocomplete="new-password"
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            autocomplete="new-password"
        >

        <div id="passwordMessage" class="error"></div>

        <div class="modal-buttons">

            <button
                class="save-password"
                onclick="changePassword()"
            >
                Save Password
            </button>

            <button
                class="cancel-button"
                onclick="closePasswordModal()"
            >
                Cancel
            </button>

        </div>

    </div>

</div>


<script>

    /* ==========================================
       SUPABASE CONNECTION
       ========================================== */

    const SUPABASE_URL =
        "https://luhagrwwkpenxccffpwf.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_P7O84PfAUNSBXRfhPoyApQ_6b0S4nhh";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

    let contacts = [];


    /* ==========================================
       CHECK LOGIN
       ========================================== */

    async function checkLogin() {

        const {
            data,
            error
        } = await supabaseClient.auth.getSession();

        if (error) {

            console.error("Session error:", error);

            return;

        }

        if (data.session) {

            showApp();

            await loadContacts();

        } else {

            showLogin();

        }

    }


    /* ==========================================
       SHOW LOGIN
       ========================================== */

    function showLogin() {

        document.getElementById("loginScreen").style.display =
            "flex";

        document.getElementById("app").style.display =
            "none";

    }


    /* ==========================================
       SHOW APP
       ========================================== */

    function showApp() {

        document.getElementById("loginScreen").style.display =
            "none";

        document.getElementById("app").style.display =
            "block";

    }


    /* ==========================================
       LOGIN
       ========================================== */

    async function login() {

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const errorBox =
            document.getElementById("loginError");

        errorBox.textContent = "";

        if (!email || !password) {

            errorBox.textContent =
                "Please enter your email and password.";

            return;

        }

        const {
            data,
            error
        } = await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });

        if (error) {

            console.error("Login error:", error);

            errorBox.textContent =
                error.message;

            return;

        }

        if (data.session) {

            showApp();

            await loadContacts();

        }

    }


    /* ==========================================
       LOAD CONTACTS
       ========================================== */

    async function loadContacts() {

        const contactsList =
            document.getElementById("contactsList");

        contactsList.innerHTML =
            '<div class="loading">Loading contacts...</div>';

        const {
            data,
            error
        } = await supabaseClient
            .from("contacts")
            .select("id, created_at, name, phone, email")
            .order("name", {
                ascending: true
            });

        if (error) {

            console.error(
                "CONTACT LOAD ERROR:",
                error
            );

            contactsList.innerHTML = `
                <div class="loading" style="color:red;">
                    <strong>Unable to load contacts.</strong>
                    <br><br>
                    ${escapeHtml(error.message)}
                </div>
            `;

            return;

        }

        contacts = data || [];

        displayContacts(contacts);

    }


    /* ==========================================
       DISPLAY CONTACTS
       ========================================== */

    function displayContacts(contactArray) {

        const contactsList =
            document.getElementById("contactsList");

        if (!contactArray.length) {

            contactsList.innerHTML =
                '<div class="loading">No contacts found.</div>';

            return;

        }

        contactsList.innerHTML =
            contactArray.map(contact => {

                const name =
                    contact.name || "";

                const phone =
                    contact.phone || "";

                const email =
                    contact.email || "";

                const safeName =
                    escapeHtml(name);

                const safePhone =
                    escapeHtml(phone);

                const safeEmail =
                    escapeHtml(email);

                const phoneLink =
                    phone.replace(/[^0-9+]/g, "");

                return `

                    <div class="contact-card">

                        <h3>
                            ${safeName}
                        </h3>

                        <p>
                            <strong>Phone:</strong>
                            <a href="tel:${phoneLink}">
                                ${safePhone}
                            </a>
                        </p>

                        <p>
                            <strong>Email:</strong>
                            <a href="mailto:${safeEmail}">
                                ${safeEmail}
                            </a>
                        </p>

                        <div class="contact-buttons">

                            <a
                                class="call-button"
                                href="tel:${phoneLink}"
                            >
                                📞 Call
                            </a>

                            <a
                                class="email-button"
                                href="mailto:${safeEmail}"
                            >
                                ✉ Email
                            </a>

                        </div>

                    </div>

                `;

            }).join("");

    }


    /* ==========================================
       SEARCH
       ========================================== */

    function searchContacts() {

        const search =
            document
                .getElementById("searchInput")
                .value
                .toLowerCase()
                .trim();

        if (!search) {

            displayContacts(contacts);

            return;

        }

        const filtered =
            contacts.filter(contact => {

                const name =
                    String(contact.name || "")
                        .toLowerCase();

                const phone =
                    String(contact.phone || "")
                        .toLowerCase();

                const email =
                    String(contact.email || "")
                        .toLowerCase();

                return (
                    name.includes(search) ||
                    phone.includes(search) ||
                    email.includes(search)
                );

            });

        displayContacts(filtered);

    }


    /* ==========================================
       OPEN PASSWORD MODAL
       ========================================== */

    function openPasswordModal() {

        document.getElementById("passwordModal").style.display =
            "block";

        document.getElementById("newPassword").value = "";

        document.getElementById("confirmPassword").value = "";

        document.getElementById("passwordMessage").textContent =
            "";

    }


    /* ==========================================
       CLOSE PASSWORD MODAL
       ========================================== */

    function closePasswordModal() {

        document.getElementById("passwordModal").style.display =
            "none";

    }


    /* ==========================================
       CHANGE PASSWORD
       ========================================== */

    async function changePassword() {

        const newPassword =
            document.getElementById("newPassword").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const message =
            document.getElementById("passwordMessage");

        message.style.color = "#d93025";

        message.textContent = "";

        if (!newPassword || !confirmPassword) {

            message.textContent =
                "Please enter the new password twice.";

            return;

        }

        if (newPassword.length < 6) {

            message.textContent =
                "Password must be at least 6 characters.";

            return;

        }

        if (newPassword !== confirmPassword) {

            message.textContent =
                "Passwords do not match.";

            return;

        }

        const {
            error
        } = await supabaseClient.auth.updateUser({

            password: newPassword

        });

        if (error) {

            console.error(
                "Password change error:",
                error
            );

            message.textContent =
                error.message;

            return;

        }

        message.style.color = "#198754";

        message.textContent =
            "Password changed successfully.";

        setTimeout(() => {

            closePasswordModal();

        }, 1500);

    }


    /* ==========================================
       LOGOUT
       ========================================== */

    async function logout() {

        await supabaseClient.auth.signOut();

        contacts = [];

        document.getElementById("contactsList").innerHTML =
            "";

        showLogin();

    }


    /* ==========================================
       HTML SECURITY
       ========================================== */

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* ==========================================
       START
       ========================================== */

    checkLogin();

</script>

</body>
</html>
