    <style>
        * {
            box-sizing: border-box;

        .login-box {

        .login-box p {

<body>

<div id="loginScreen">

    <div class="login-box">

        <h1>CHRISTCH</h1>

        <p>Company Contacts</p>

        <input
            type="email"
            id="email"
            placeholder="Company email"
            autocomplete="username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button class="login-button" onclick="login()">
            Login
        </button>

        <div id="loginError"></div>

    </div>

</div>


<div id="app">

    <div class="container">

        <div class="header">

            <div class="header-top">

                <div>
                    <h1>CHRISTCH - Company Contacts</h1>
                    <p id="loggedInUser"></p>
                </div>

                <div class="header-buttons">

                    <button
                        class="change-password"
                        onclick="openPasswordModal()">
                        Change Password
                    </button>

                    <button
                        class="logout"
                        onclick="logout()">
                        Logout
                    </button>

                </div>

            </div>

        </div>

        <div class="search-box">

            <input
                type="text"
                id="search"
                placeholder="Search contacts..."
                oninput="searchContacts()">

        </div>

        <div id="loading">
            Loading contacts...
        </div>

        <div id="contacts"></div>

        <div id="noResults">
            No contacts found.
        </div>

    </div>

</div>


<div id="passwordModal" class="modal">

    <div class="modal-content">

        <h2>Change Password</h2>

        <input
            type="password"
            id="newPassword"
            placeholder="New password"
            autocomplete="new-password">

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            autocomplete="new-password">

        <div class="modal-buttons">

            <button
                class="save-password"
                onclick="changePassword()">
                Change Password
            </button>

            <button
                class="cancel-button"
                onclick="closePasswordModal()">
                Cancel
            </button>

        </div>

        <div id="passwordMessage"></div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://luhagrwwkpenxccffpwf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_P7O84PfAUNSBXRfhPoyApQ_6b0S4nhh";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let allContacts = [];


async function checkLogin() {

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (session) {
        showApp(session);
    } else {
        showLogin();
    }
}


async function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const errorElement =
        document.getElementById("loginError");

    errorElement.textContent = "";

    if (!email || !password) {

        errorElement.textContent =
            "Please enter your email and password.";

        return;
    }

    const {
        data,
        error
    } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {

        errorElement.textContent =
            error.message;

        return;
    }

    showApp(data.session);
}


function showApp(session) {

    document.getElementById("loginScreen").style.display =
        "none";

    document.getElementById("app").style.display =
        "block";

    document.getElementById("loggedInUser").textContent =
        "Logged in as: " + session.user.email;

    loadContacts();
}


function showLogin() {

    document.getElementById("loginScreen").style.display =
        "flex";

    document.getElementById("app").style.display =
        "none";
}


async function logout() {

    await supabaseClient.auth.signOut();

    allContacts = [];

    document.getElementById("contacts").innerHTML = "";

    showLogin();
}


async function loadContacts() {

    const loading =
        document.getElementById("loading");

    const contactsDiv =
        document.getElementById("contacts");

    loading.style.display = "block";

    contactsDiv.innerHTML = "";

    const {
        data,
        error
    } = await supabaseClient
        .from("contacts")
        .select("*")
        .order("name", { ascending: true });

    loading.style.display = "none";

    if (error) {

        console.error(error);

        contactsDiv.innerHTML =
            "<p>Unable to load contacts. Please contact IT support.</p>";

        return;
    }

    allContacts = data || [];

    displayContacts(allContacts);
}


function displayContacts(contacts) {

    const contactsDiv =
        document.getElementById("contacts");

    const noResults =
        document.getElementById("noResults");

    contactsDiv.innerHTML = "";

    if (contacts.length === 0) {

        noResults.style.display = "block";

        return;
    }

    noResults.style.display = "none";

    contacts.forEach(contact => {

        const card =
            document.createElement("div");

        card.className =
            "contact-card";

        const name =
            escapeHtml(contact.name || "");

        const phone =
            escapeHtml(contact.phone || "");

        const email =
            escapeHtml(contact.email || "");

        let phoneButton = "";

        if (contact.phone) {

            phoneButton = `
                <a
                    class="call-button"
                    href="tel:${contact.phone}">
                    📞 Call
                </a>
            `;
        }

        let emailButton = "";

        if (contact.email) {

            emailButton = `
                <a
                    class="email-button"
                    href="mailto:${contact.email}">
                    ✉ Email
                </a>
            `;
        }

        card.innerHTML = `

            <div class="contact-name">
                ${name}
            </div>

            <div class="contact-detail">
                📞 ${phone || "No phone number"}
            </div>

            <div class="contact-detail">
                ✉ ${email || "No email address"}
            </div>

            <div class="contact-actions">
                ${phoneButton}
                ${emailButton}
            </div>

        `;

        contactsDiv.appendChild(card);

    });
}


function searchContacts() {

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();

    if (!search) {

        displayContacts(allContacts);

        return;
    }

    const filtered =
        allContacts.filter(contact => {

            const name =
                (contact.name || "").toLowerCase();

            const phone =
                (contact.phone || "").toLowerCase();

            const email =
                (contact.email || "").toLowerCase();

            return (
                name.includes(search) ||
                phone.includes(search) ||
                email.includes(search)
            );

        });

    displayContacts(filtered);
}


function openPasswordModal() {

    document.getElementById("passwordModal").style.display =
        "block";

    document.getElementById("passwordMessage").textContent =
        "";

    document.getElementById("newPassword").value = "";

    document.getElementById("confirmPassword").value = "";
}


function closePasswordModal() {

    document.getElementById("passwordModal").style.display =
        "none";
}


async function changePassword() {

    const newPassword =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("passwordMessage");

    message.textContent = "";

    if (newPassword.length < 8) {

        message.textContent =
            "Password must be at least 8 characters.";

        return;
    }

    if (newPassword !== confirmPassword) {

        message.textContent =
            "Passwords do not match.";

        return;
    }

    const {
        error
    } = await supabaseClient.auth.updateUser({
        password: newPassword
    });

    if (error) {

        message.textContent =
            error.message;

        return;
    }

    message.textContent =
        "Password changed successfully.";

    setTimeout(() => {
        closePasswordModal();
    }, 1500);
}


function escapeHtml(value) {

    return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


checkLogin();

</script>

</body>
</html>
